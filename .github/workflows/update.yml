# 올팍 타이밍 — 예보 자동 갱신(공연 일정 수집 → 60일 예보 생성 → 실시간 표시값 기록 → 배포)
name: update-forecast
on:
  schedule:
    - cron: "17 * * * *"   # 매시간 예약(UTC). GitHub 예약 실행은 밀릴 수 있어 실제 간격은 더 길다
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["public/data/live_log.json"]
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build.mjs
      - name: commit live log
        run: |
          git config user.name "olpark-timing-bot"; git config user.email "actions@users.noreply.github.com"
          git add public/data/live_log.json public/data/summary.json public/data/fc || true
          git commit -m "예보 갱신 $(date -u +%FT%TZ)" || echo "no change"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
